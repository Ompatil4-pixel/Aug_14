 <!DOCTYPE html>
<html>
<head>
    <title>Nested Elements Challenge</title>
</head>
<body>
    
        <h1 align="center">Nested Elements Demo</h1>
        
        <!-- First paragraph with STRONG and EM -->
        <p>
            This is a <strong>very important</strong> message, 
            and it should be <em>emphasized clearly</em>.
        </p>
        
        <!-- Second paragraph with MARK and SMALL -->
        <p>
            Please note the <mark>highlighted text</mark> 
            and read the <small>fine print carefully</small>.
        </p>
    
</body>
</html>
